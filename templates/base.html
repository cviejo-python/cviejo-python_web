<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}WoodPau{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Elegimos Bootswatch Lux (Bootstrap 5) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/lux/bootstrap.min.css"
    rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    rel="stylesheet">

  <!-- Tu CSS -->
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='main.css') }}">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>



<body>
<! ----------------desde base.html hacemos la llamada al encabezado de nav.html---------------------------->
  {% include "partials/nav.html" %}

  <!-- MENSAJES FLASH CENTRADOS EN PANTALLA -->
  <div class="position-fixed top-50 start-50 translate-middle"
       style="z-index: 9999; width: 500px; max-width: 90%;">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}

        {% for category, message in messages %}

          <div class="alert alert-{{ category }} alert-dismissible fade show shadow-lg rounded-4 border-0 text-center p-4"
               role="alert">

            <div class="d-flex align-items-center justify-content-center mb-2">

              <i class="bi bi-exclamation-triangle-fill me-2 fs-4"></i>

              <span class="fs-5">{{ message }}</span>

            </div>

            <button type="button"
                    class="btn-close position-absolute top-0 end-0 m-3"
                    data-bs-dismiss="alert">
            </button>

          </div>

        {% endfor %}

      {% endif %}
    {% endwith %}

  </div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
